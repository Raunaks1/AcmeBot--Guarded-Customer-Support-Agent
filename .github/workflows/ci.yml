name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-evaluate:
    name: Test & Evaluate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest -v

      - name: Run evaluation suite & safety gate
        run: |
          python -m evals.run_evals --baseline --min-pass 0.95 --min-security 1.0

      - name: Publish evaluation summary to job summary
        if: always()
        run: |
          if [ -f evals/results/results.md ]; then
            cat evals/results/results.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload evaluation results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-python-${{ matrix.python-version }}
          path: evals/results/
          if-no-files-found: ignore

